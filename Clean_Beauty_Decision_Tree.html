      &lt;section class=&quot;cb5-purpose&quot; id=&quot;tool2-overview&quot; aria-labelledby=&quot;cb5-purpose-title&quot;&gt;

        &lt;div class=&quot;cb5-flow&quot; role=&quot;list&quot; aria-label=&quot;Five steps from research to result&quot;&gt;
          &lt;div class=&quot;cb5-flow-step&quot; role=&quot;listitem&quot;&gt;
            &lt;span class=&quot;cb5-flow-number&quot;&gt;01&lt;/span&gt;
            &lt;strong&gt;Public research&lt;/strong&gt;
            &lt;p&gt;Market context from the sources shown here&lt;/p&gt;
          &lt;/div&gt;
          &lt;div class=&quot;cb5-flow-step&quot; role=&quot;listitem&quot;&gt;
            &lt;span class=&quot;cb5-flow-number&quot;&gt;02&lt;/span&gt;
            &lt;strong&gt;Market questions&lt;/strong&gt;

          &lt;/div&gt;

            &lt;strong&gt;Your answers&lt;/strong&gt;

            &lt;span class=&quot;cb5-flow-number&quot;&gt;05&lt;/span&gt;

      &lt;/section&gt;

      &lt;section class=&quot;cb5-section&quot; id=&quot;cb5-tool&quot; aria-labelledby=&quot;cb5-tool-title&quot;&gt;
        &lt;div class=&quot;cb5-section-label&quot;&gt;Answer the questions&lt;/div&gt;
        &lt;h2 id=&quot;cb5-tool-title&quot;&gt;What do you expect by September 2028?&lt;/h2&gt;
        &lt;p class=&quot;cb5-intro&quot;&gt;For each statement, consider the research shown below and move the slider toward Very unlikely or Very likely. At 50% or higher, the statement counts as Yes. Both results update immediately.&lt;/p&gt;
        &lt;div class=&quot;cb5-tool-note&quot;&gt;
          &lt;span&gt;The sliders begin at example positions. Move them to try your own answers. Your changes are not saved.&lt;/span&gt;
          &lt;button class=&quot;cb5-button cursor-interaction&quot; id=&quot;cb5-reset&quot; type=&quot;button&quot;&gt;Reset sliders&lt;/button&gt;
        &lt;/div&gt;

        &lt;div class=&quot;cb5-workspace&quot;&gt;
          &lt;div class=&quot;cb5-signals&quot;&gt;
            &lt;div class=&quot;cb5-signal is-no&quot; data-key=&quot;retail&quot;&gt;
              &lt;div class=&quot;cb5-signal-index&quot;&gt;Question 1 · Retail visibility&lt;/div&gt;
              &lt;div class=&quot;cb5-question&quot;&gt;In September 2028, Sephora and Ulta will each still offer “clean” as a distinct way to shop.&lt;/div&gt;
              &lt;p class=&quot;cb5-signal-context&quot;&gt;Today, both retailers make clean products discoverable, but they use different labels and standards.&lt;/p&gt;
              &lt;p class=&quot;cb5-signal-source&quot;&gt;Sources: &lt;a href=&quot;https://www.ulta.com/discover/conscious-beauty&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Ulta Conscious Beauty&lt;/a&gt; · &lt;a href=&quot;https://www.sephora.com/beauty/planet-aware&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Sephora Clean + Planet Aware&lt;/a&gt;&lt;/p&gt;
              &lt;div class=&quot;cb5-control&quot;&gt;
                &lt;div class=&quot;cb5-control-head&quot;&gt;&lt;label for=&quot;cb5-retail&quot;&gt;How likely?&lt;/label&gt;&lt;output class=&quot;cb5-value&quot; for=&quot;cb5-retail&quot;&gt;36%&lt;/output&gt;&lt;/div&gt;
                &lt;input class=&quot;cb5-range cursor-interaction&quot; id=&quot;cb5-retail&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;36&quot; aria-label=&quot;Chance that Sephora and Ulta each offer clean as a distinct way to shop in September 2028&quot; /&gt;
                &lt;div class=&quot;cb5-range-ends&quot;&gt;&lt;span&gt;Very unlikely&lt;/span&gt;&lt;span&gt;Very likely&lt;/span&gt;&lt;/div&gt;
                &lt;output class=&quot;cb5-binary&quot; aria-live=&quot;polite&quot;&gt;Counts as No&lt;/output&gt;
              &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;cb5-signal is-no&quot; data-key=&quot;performance&quot;&gt;
              &lt;div class=&quot;cb5-signal-index&quot;&gt;Question 2 · Brand performance&lt;/div&gt;
              &lt;div class=&quot;cb5-question&quot;&gt;In 2028, clean-led prestige skincare will grow at least as fast as U.S. prestige skincare overall.&lt;/div&gt;
              &lt;p class=&quot;cb5-signal-context&quot;&gt;Circana reported clean-skincare declines, while U.S. prestige skincare overall grew 3% in 2025.&lt;/p&gt;
              &lt;p class=&quot;cb5-signal-source&quot;&gt;Sources: &lt;a href=&quot;https://www.circana.com/post/what-it-means-to-be-clean&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Circana, “What It Means to Be Clean”&lt;/a&gt; · &lt;a href=&quot;https://www.circana.com/post/us-prestige-and-mass-beauty-retail-deliver-a-positive-performance-in-2025-circana-reports&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;Circana’s 2025 beauty review&lt;/a&gt;&lt;/p&gt;
              &lt;div class=&quot;cb5-control&quot;&gt;
                &lt;div class=&quot;cb5-control-head&quot;&gt;&lt;label for=&quot;cb5-performance&quot;&gt;How likely?&lt;/label&gt;&lt;output class=&quot;cb5-value&quot; for=&quot;cb5-performance&quot;&gt;28%&lt;/output&gt;&lt;/div&gt;
                &lt;input class=&quot;cb5-range cursor-interaction&quot; id=&quot;cb5-performance&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;28&quot; aria-label=&quot;Chance that clean-led prestige skincare grows at least as fast as prestige skincare overall in 2028&quot; /&gt;
                &lt;div class=&quot;cb5-range-ends&quot;&gt;&lt;span&gt;Very unlikely&lt;/span&gt;&lt;span&gt;Very likely&lt;/span&gt;&lt;/div&gt;
                &lt;output class=&quot;cb5-binary&quot; aria-live=&quot;polite&quot;&gt;Counts as No&lt;/output&gt;
              &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;cb5-signal is-yes&quot; data-key=&quot;standards&quot;&gt;
              &lt;div class=&quot;cb5-signal-index&quot;&gt;Question 3 · Standards and trust&lt;/div&gt;
              &lt;div class=&quot;cb5-question&quot;&gt;By September 2028, at least two major U.S. beauty retailers will use an independent standard to verify clean-beauty claims.&lt;/div&gt;
              &lt;p class=&quot;cb5-signal-context&quot;&gt;Consumer interest in ingredient claims remains strong, and safety data and cosmetics regulation are becoming more formal. The sources do not yet show broad retailer adoption of one independent standard.&lt;/p&gt;
              &lt;p class=&quot;cb5-signal-source&quot;&gt;Sources: &lt;a href=&quot;https://www.nsf.org/news/consumers-consider-personal-care-organic-ingredients-important&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;NSF consumer survey&lt;/a&gt; · &lt;a href=&quot;https://www.chemforward.org/news/bpc-leaders-release-2025-report&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;ChemFORWARD report&lt;/a&gt; · &lt;a href=&quot;https://www.fda.gov/cosmetics/cosmetics-laws-regulations/modernization-cosmetics-regulation-act-2022-mocra&quot; target=&quot;_blank&quot; rel=&quot;noopener noreferrer&quot;&gt;FDA MoCRA overview&lt;/a&gt;&lt;/p&gt;
              &lt;p class=&quot;cb5-signal-source&quot;&gt;The NSF survey concerns organic ingredients, which are not the same as clean beauty. It is included only as evidence of consumer interest in ingredient claims.&lt;/p&gt;
              &lt;div class=&quot;cb5-control&quot;&gt;
                &lt;div class=&quot;cb5-control-head&quot;&gt;&lt;label for=&quot;cb5-standards&quot;&gt;How likely?&lt;/label&gt;&lt;output class=&quot;cb5-value&quot; for=&quot;cb5-standards&quot;&gt;69%&lt;/output&gt;&lt;/div&gt;
                &lt;input class=&quot;cb5-range cursor-interaction&quot; id=&quot;cb5-standards&quot; type=&quot;range&quot; min=&quot;1&quot; max=&quot;99&quot; value=&quot;69&quot; aria-label=&quot;Chance that two major U.S. beauty retailers use an independent standard for clean-beauty claims by September 2028&quot; /&gt;
                &lt;div class=&quot;cb5-range-ends&quot;&gt;&lt;span&gt;Very unlikely&lt;/span&gt;&lt;span&gt;Very likely&lt;/span&gt;&lt;/div&gt;
                &lt;output class=&quot;cb5-binary&quot; aria-live=&quot;polite&quot;&gt;Counts as Yes&lt;/output&gt;
              &lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;

          &lt;aside class=&quot;cb5-result&quot; id=&quot;cb5-result&quot; aria-labelledby=&quot;cb5-result-title&quot;&gt;
            &lt;div class=&quot;cb5-result-head&quot;&gt;
              &lt;div class=&quot;cb5-section-label&quot;&gt;Live category result&lt;/div&gt;
              &lt;h2 id=&quot;cb5-result-title&quot;&gt;What your answers indicate&lt;/h2&gt;
              &lt;p&gt;Changes as you move a slider&lt;/p&gt;
            &lt;/div&gt;

            &lt;div class=&quot;cb5-answer-grid&quot;&gt;
              &lt;div class=&quot;cb5-answer&quot; id=&quot;cb5-relevant-answer&quot;&gt;
                &lt;div class=&quot;cb5-answer-question&quot;&gt;Will clean beauty remain relevant?&lt;/div&gt;
                &lt;output class=&quot;cb5-answer-word&quot; id=&quot;cb5-relevant-word&quot;&gt;Yes&lt;/output&gt;
                &lt;p class=&quot;cb5-answer-copy&quot; id=&quot;cb5-relevant-copy&quot;&gt;Yes, because you answered Yes to at least one question.&lt;/p&gt;
              &lt;/div&gt;
              &lt;div class=&quot;cb5-answer is-no&quot; id=&quot;cb5-distinct-answer&quot;&gt;
                &lt;div class=&quot;cb5-answer-question&quot;&gt;Will it remain one clearly defined category?&lt;/div&gt;
                &lt;output class=&quot;cb5-answer-word&quot; id=&quot;cb5-distinct-word&quot;&gt;No&lt;/output&gt;
                &lt;p class=&quot;cb5-answer-copy&quot; id=&quot;cb5-distinct-copy&quot;&gt;No, because retail visibility and brand performance must both be Yes.&lt;/p&gt;
              &lt;/div&gt;
            &lt;/div&gt;

            &lt;div class=&quot;cb5-signal-summary&quot; aria-label=&quot;Your current answers&quot;&gt;
              &lt;div class=&quot;cb5-summary-item is-no&quot; data-summary=&quot;retail&quot;&gt;&lt;span class=&quot;cb5-summary-label&quot;&gt;Retail visibility&lt;/span&gt;&lt;output class=&quot;cb5-summary-value&quot;&gt;No · 36%&lt;/output&gt;&lt;/div&gt;
              &lt;div class=&quot;cb5-summary-item is-no&quot; data-summary=&quot;performance&quot;&gt;&lt;span class=&quot;cb5-summary-label&quot;&gt;Brand performance&lt;/span&gt;&lt;output class=&quot;cb5-summary-value&quot;&gt;No · 28%&lt;/output&gt;&lt;/div&gt;
              &lt;div class=&quot;cb5-summary-item is-yes&quot; data-summary=&quot;standards&quot;&gt;&lt;span class=&quot;cb5-summary-label&quot;&gt;Independent standards&lt;/span&gt;&lt;output class=&quot;cb5-summary-value&quot;&gt;Yes · 69%&lt;/output&gt;&lt;/div&gt;
            &lt;/div&gt;

            &lt;p class=&quot;cb5-meaning&quot; id=&quot;cb5-meaning&quot; aria-live=&quot;polite&quot;&gt;Your answers suggest that clean beauty will remain relevant, but not as one clearly defined category.&lt;/p&gt;

            &lt;div class=&quot;cb5-rules&quot;&gt;
              &lt;h3&gt;Rules used in this Decision Tree&lt;/h3&gt;
              &lt;ul class=&quot;cb5-rule-list&quot;&gt;
                &lt;li&gt;&lt;strong&gt;For this prototype,&lt;/strong&gt; a slider at 50% or higher counts as Yes.&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;Clean beauty counts as relevant&lt;/strong&gt; when at least one question is Yes.&lt;/li&gt;
                &lt;li&gt;&lt;strong&gt;It counts as one clearly defined category&lt;/strong&gt; only when retail visibility and brand performance are both Yes.&lt;/li&gt;
                &lt;li&gt;Relevance uses &lt;strong&gt;OR&lt;/strong&gt;: any one Yes makes the answer Yes. Category definition uses &lt;strong&gt;AND&lt;/strong&gt;: retail visibility and brand performance must both be Yes. These are simple Boolean rules.&lt;/li&gt;
              &lt;/ul&gt;
            &lt;/div&gt;
          &lt;/aside&gt;
        &lt;/div&gt;
      &lt;/section&gt;

      &lt;section class=&quot;cb5-brand-bridge&quot; aria-labelledby=&quot;cb5-brand-bridge-title&quot;&gt;
        &lt;div class=&quot;cb5-section-label&quot;&gt;How this relates to brands&lt;/div&gt;
        &lt;h2 id=&quot;cb5-brand-bridge-title&quot;&gt;This result describes the category, not an individual brand.&lt;/h2&gt;
        &lt;p&gt;If clean beauty remains relevant but becomes less clearly defined, brands may need to be more specific about what “clean” means for them. The Research Brief explores four possible directions: ingredient safety, proven performance, biotechnology, and environmental and ethical standards.&lt;/p&gt;

&lt;script&gt;
  (() =&gt; {
    const root = document.getElementById(&#x27;clean-beauty-oracle-v5&#x27;);
    const signalElements = Array.from(root.querySelectorAll(&#x27;.cb5-signal&#x27;));
    const result = root.querySelector(&#x27;#cb5-result&#x27;);
    const relevantAnswer = root.querySelector(&#x27;#cb5-relevant-answer&#x27;);
    const distinctAnswer = root.querySelector(&#x27;#cb5-distinct-answer&#x27;);
    const relevantWord = root.querySelector(&#x27;#cb5-relevant-word&#x27;);
    const distinctWord = root.querySelector(&#x27;#cb5-distinct-word&#x27;);
    const relevantCopy = root.querySelector(&#x27;#cb5-relevant-copy&#x27;);
    const distinctCopy = root.querySelector(&#x27;#cb5-distinct-copy&#x27;);
    const meaning = root.querySelector(&#x27;#cb5-meaning&#x27;);
    let animationTimer;

    function setAnswer(element, wordElement, value) {
      element.classList.toggle(&#x27;is-no&#x27;, !value);
      wordElement.textContent = value ? &#x27;Yes&#x27; : &#x27;No&#x27;;
    }

    function update(animate = false) {
      const state = {};

      signalElements.forEach((signal) =&gt; {
        const input = signal.querySelector(&#x27;input[type=&quot;range&quot;]&#x27;);
        const valueOutput = signal.querySelector(&#x27;.cb5-value&#x27;);
        const binaryOutput = signal.querySelector(&#x27;.cb5-binary&#x27;);
        const value = Number(input.value);
        const yes = value &gt;= 50;

        state[signal.dataset.key] = { value, yes };
        signal.classList.toggle(&#x27;is-yes&#x27;, yes);
        signal.classList.toggle(&#x27;is-no&#x27;, !yes);
        input.style.setProperty(&#x27;--value&#x27;, `${value}%`);
        input.setAttribute(&#x27;aria-valuetext&#x27;, `${value}% chance of Yes; counts as ${yes ? &#x27;Yes&#x27; : &#x27;No&#x27;}`);
        valueOutput.textContent = `${value}%`;
        binaryOutput.textContent = `Counts as ${yes ? &#x27;Yes&#x27; : &#x27;No&#x27;}`;

        const summary = root.querySelector(`[data-summary=&quot;${signal.dataset.key}&quot;]`);
        summary.classList.toggle(&#x27;is-yes&#x27;, yes);
        summary.classList.toggle(&#x27;is-no&#x27;, !yes);
        summary.querySelector(&#x27;.cb5-summary-value&#x27;).textContent = `${yes ? &#x27;Yes&#x27; : &#x27;No&#x27;} · ${value}%`;
      });

      const relevant = state.retail.yes || state.performance.yes || state.standards.yes;
      const distinct = state.retail.yes &amp;&amp; state.performance.yes;

      setAnswer(relevantAnswer, relevantWord, relevant);
      setAnswer(distinctAnswer, distinctWord, distinct);

      relevantCopy.textContent = relevant
        ? &#x27;Yes, because you answered Yes to at least one question.&#x27;
        : &#x27;No, because none of your answers is Yes.&#x27;;

      distinctCopy.textContent = distinct
        ? &#x27;Yes, because retail visibility and brand performance are both Yes.&#x27;
        : &#x27;No, because retail visibility and brand performance are not both Yes.&#x27;;

      if (relevant &amp;&amp; distinct) {
        meaning.textContent = &#x27;Your answers suggest that clean beauty will remain relevant and continue as one clearly defined category.&#x27;;
      } else if (relevant) {
        meaning.textContent = &#x27;Your answers suggest that clean beauty will remain relevant, but not as one clearly defined category.&#x27;;
      } else {
        meaning.textContent = &#x27;Your answers suggest that clean beauty will not remain relevant as a category by September 2028.&#x27;;
      }

      if (animate) {
        result.classList.remove(&#x27;is-updating&#x27;);
        void result.offsetWidth;
        result.classList.add(&#x27;is-updating&#x27;);
        clearTimeout(animationTimer);
        animationTimer = setTimeout(() =&gt; result.classList.remove(&#x27;is-updating&#x27;), 320);
      }
    }

    signalElements.forEach((signal) =&gt; {
      signal.querySelector(&#x27;input[type=&quot;range&quot;]&#x27;).addEventListener(&#x27;input&#x27;, () =&gt; update(true));
    });

    root.querySelector(&#x27;#cb5-reset&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
      const examples = { retail: 36, performance: 28, standards: 69 };
      signalElements.forEach((signal) =&gt; {
        signal.querySelector(&#x27;input[type=&quot;range&quot;]&#x27;).value = examples[signal.dataset.key];
      });
      update(true);
    });

    update(false);
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;

&lt;script&gt;
(() =&gt; {

  }

    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (event) =&gt; {
    for (const target of event.composedPath()) {
      if (target?.nodeType === Node.ELEMENT_NODE) {
        const trigger = target.closest(&quot;[data-tooltip]&quot;);
        if (trigger) return trigger;
      }
    }
    return null;
  };
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;

      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {

    }

  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };

    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handlers = {
    pointerover: handlePointerOpen,
    pointerdown: handlePointer,
    pointercancel: handlePointer,
    click: handleTouchClick,
    pointerout: handleLeave,
    focusin: handleFocusIn,
    focusout: handleLeave,
    keydown: handleKeyDown,
    contextmenu: handleContextMenu,
  };
  const roots = new Map();
  const handledEvents = new WeakSet();
  const handleEvent = (event) =&gt; {
    if (handledEvents.has(event)) return;
    handledEvents.add(event);
    handlers[event.type](event);
  };
  const discoverRoots = (node) =&gt; {
    if (node.shadowRoot) listen(node.shadowRoot);
    for (const element of node.querySelectorAll(&quot;*&quot;)) {
      if (element.shadowRoot) listen(element.shadowRoot);
    }
  };
  const listen = (root) =&gt; {
    if (roots.has(root)) return;
    for (const type of Object.keys(handlers)) root.addEventListener(type, handleEvent);
    const observer = new window.MutationObserver((records) =&gt; {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (node.nodeType === Node.ELEMENT_NODE) discoverRoots(node);
        }
      }
      for (const [root, cleanup] of roots) {
        if (root.host &amp;&amp; !root.host.isConnected) {
          cleanup();
          roots.delete(root);
        }
      }
      if (activeTrigger &amp;&amp; !activeTrigger.isConnected) closeTooltip(false);
    });
    observer.observe(root, { childList: true, subtree: true });
    roots.set(root, () =&gt; {
      observer.disconnect();
      for (const type of Object.keys(handlers)) root.removeEventListener(type, handleEvent);
    });
    discoverRoots(root);
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    for (const cleanup of roots.values()) cleanup();
    roots.clear();
    tooltip = null;
  };

  // Events between children of one shadow root never reach the document.
  listen(document);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {
  const selector = &#x27;.nav[role=&quot;tablist&quot;] [role=&quot;tab&quot;]&#x27;;
  const disabled = &#x27;:disabled,[aria-disabled=&quot;true&quot;]&#x27;;
  const selectTab = (selected) =&gt; {
    const panelId = selected.getAttribute(&quot;aria-controls&quot;);
    for (const tab of selected.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;)) {
      const active = tab === selected;
      tab.classList.toggle(&quot;active&quot;, active);
      tab.setAttribute(&quot;aria-selected&quot;, String(active));
      const id = tab.getAttribute(&quot;aria-controls&quot;);
      const panel = id &amp;&amp; document.getElementById(id);
      if (panel != null) {
        panel.hidden = id !== panelId;
        if (!panel.hidden &amp;&amp; selected.id) {
          panel.setAttribute(&quot;aria-labelledby&quot;, selected.id);
        }
      }
    }
  };
  const interact = (event) =&gt; {
    const tab = event.target?.closest?.(selector);
    if (event.defaultPrevented || tab == null || tab.matches(disabled)) {
      return;
    }
    if (event.type === &quot;click&quot;) {
      selectTab(tab);
      return;
    }
    const tabs = Array.from(
      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;]&#x27;);
    if (selected != null) {
      selectTab(selected);
    }
  }

  document.addEventListener(&quot;keydown&quot;, interact);
  window.addEventListener(&quot;pagehide&quot;, () =&gt; {
    document.removeEventListener(&quot;click&quot;, interact);
    document.removeEventListener(&quot;keydown&quot;, interact);
  }, { once: true });
})();
